name: StarCraft Design Lab
on:
  pull_request:
    paths:
      - 'starcraft_lab/**'
      - '.github/workflows/starcraft-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check synthetic patch and telemetry tests
        run: python -m unittest discover -s starcraft_lab/tests -v
