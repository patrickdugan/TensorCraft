name: StarCraft Design Lab
on:
  pull_request:
    paths:
      - 'starcraft_lab/**'
      - '.github/workflows/starcraft-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check synthetic patch and telemetry tests
        run: python -m unittest discover -s starcraft_lab/tests -v
  replay-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starcraft_lab/replay_probe
      - name: Test replay extraction without game assets
        working-directory: starcraft_lab/replay_probe
        run: cargo test --all-targets
      - name: Checkout public legacy replay fixture
        uses: actions/checkout@v4
        with:
          repository: broodwar-live/bw-engine
          ref: c1014fa068a927c3c9f09fc5cea7be157f9f5742
          path: _upstream_replay_fixture
      - name: Parse real legacy replay through pinned parser
        run: |
          cargo run --quiet --manifest-path starcraft_lab/replay_probe/Cargo.toml -- _upstream_replay_fixture/tests/fixtures/larva_vs_mini.rep /tmp/starcraft_replay_probe.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rep = Path("_upstream_replay_fixture/tests/fixtures/larva_vs_mini.rep")
          from starcraft_lab.farm.runner import _replay_envelope
          assert _replay_envelope(rep), "A genuine upstream replay must pass the runner's envelope preflight"
          data = json.loads(Path("/tmp/starcraft_replay_probe.json").read_text())
          assert data["schema"] == 1
          assert data["replay_sha256"] == hashlib.sha256(rep.read_bytes()).hexdigest()
          assert data["command_count"] > 0
          assert len(data["players"]) >= 2
          assert all("devourer" in p["unit_orders"] for p in data["players"])
          print("Replay fixture parsed:", data["map_name"], data["command_count"], "commands")
          for player in data["players"]:
              o = player["unit_orders"]
              print("Sample:", player["name"], player["race"], "Muta orders", o["mutalisk"]["issued_orders"],
                    "Devourer orders", o["devourer"]["issued_orders"],
                    "Scout orders", o["scout"]["issued_orders"])
          PY

  world-model-priors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synthetic counterfactual A/B research priors
        run: python -m starcraft_lab.world_model.experiments --trials 256 --sensitivity-trials 24 --seed 20261025 --output /tmp/starcraft_model_priors.json
      - name: Generate complete named-unit A-versus-B capability matrix
        run: python -m starcraft_lab.world_model.matchups --json /tmp/starcraft_pairwise_matrix.json --csv /tmp/starcraft_pairwise_matrix.csv
      - name: Export fillable StarCraft ontology tables
        run: python -m starcraft_lab.world_model.scaffold --output-dir /tmp/tensorcraft_model_fill
      - name: Validate outputs and display labeled sample matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/starcraft_model_priors.json")
          r=json.loads(p.read_text())
          assert r["sampled_matches_are_not_starcraft_matches"] is True
          assert r["fidelity"]=="low / uncalibrated"
          assert len(r["scenario_results"]) >= 6
          for s in r["scenario_results"]:
              x=s["predictions"]
              assert len(x)==4
              assert all(0 <= v["a_favorable_fraction"] <= 1 for v in x.values())
              v= s["factorial"]
              assert abs(v["interaction"] - (x["devourer_speed_550_cooldown_90"]["a_favorable_fraction"]-x["devourer_speed_550"]["a_favorable_fraction"]-x["devourer_cooldown_90"]["a_favorable_fraction"]+x["control"]["a_favorable_fraction"])) < 1e-3
              print("GUESSTIMATE",s["scenario_id"],"control",x["control"]["a_favorable_fraction"],"speed",x["devourer_speed_550"]["a_favorable_fraction"],"cooldown",x["devourer_cooldown_90"]["a_favorable_fraction"],"both",x["devourer_speed_550_cooldown_90"]["a_favorable_fraction"],"interaction",v["interaction"])
          print("PRIORITY",r["active_learning_queue"][:3])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tensorcraft-world-model-guestimates
          path: |
            /tmp/starcraft_model_priors.json
            /tmp/starcraft_pairwise_matrix.json
            /tmp/starcraft_pairwise_matrix.csv
            /tmp/tensorcraft_model_fill/
          retention-days: 14

  bwapi-x86-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BWAPI 4.4.0 headers (no game data)
        uses: actions/checkout@v4
        with:
          repository: bwapi/bwapi
          ref: v4.4.0
          fetch-depth: 0
          path: _bwapi44
      - name: Initialize Win32 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Generate versioned svnrev header using tagged git history
        shell: pwsh
        run: |
          $commits = & git -C "_bwapi44" rev-list HEAD --count
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rev = 2383 + [int]$commits
          $header = @("#pragma once", "static const int SVN_REV = $rev;", '#include "starcraftver.h"')
          $header | Set-Content "_bwapi44/bwapi/include/svnrev.h" -Encoding ascii
          Write-Host "Built a local-only BWAPI revision header for tagged v4.4.0; revision $rev"
      - name: Build pinned LGPL-3.0 BWAPILIB locally on CI
        shell: pwsh
        run: |
          msbuild "_bwapi44\bwapi\BWAPILIB\BWAPILIB.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lib = Get-ChildItem "_bwapi44\bwapi" -Recurse -Filter "BWAPILIB.lib" | Select-Object -First 1
          if (-not $lib) { throw "Tagged BWAPILIB.lib was not built" }
          "BWAPILIB_PATH=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Link x86 observer DLL for CI-only compatibility smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "TensorCraftTrace.dll"
          & cl /nologo /MD /EHsc /std:c++14 /LD "/I_bwapi44\bwapi\include" "starcraft_lab\live_trace\TraceTournament.cpp" $env:BWAPILIB_PATH Shlwapi.lib /link "/OUT:$target" /MACHINE:X86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $target)) { throw "Trace observer DLL linkage did not produce binary" }
          & dumpbin /headers $target | Select-String "machine \(x86\)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile passive trace observer to x86 object (no engine linkage)
        shell: cmd
        run: cl /nologo /EHsc /std:c++14 /W4 /c /I "_bwapi44\bwapi\include" "starcraft_lab\live_trace\TraceTournament.cpp" /Fo:"%TEMP%\TensorCraftTrace.obj"

  farm-synthetic-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (CI asset-free codec proof)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify FFmpeg and libx264 support
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -encoders | grep libx264
          ffprobe -version | head -n 1
      - name: Encode/inspect synthetic 5-second 1080p30 YouTube-style MP4
        run: |
          mkdir -p /tmp/tensorcraft-video-test
          python -m starcraft_lab.farm.smoke_video --output /tmp/tensorcraft-video-test/TEST_PATTERN_NOT_STARCRAFT.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/tensorcraft-video-test")
          data=json.loads((root/"TEST_PATTERN_NOT_STARCRAFT.receipt.json").read_text())
          assert data["producer"]=="synthetic_ffmpeg_test_pattern"
          assert data["youtube_container_and_codec_compatible"]
          assert not data["actual_starcraft_footage"]
          assert not data["gameplay_visual_content_verified"]
          assert data["duration_seconds"]>=4.8
          print("Synthetic YouTube MP4 encoding contract passed (NOT a StarCraft replay)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tensorcraft-youtube-codec-SYNTHETIC-TEST-NOT-GAMEPLAY
          path: /tmp/tensorcraft-video-test/
          retention-days: 7
